plugins { id 'com.android.application' }

android {
    namespace 'org.synthai.computer'
    compileSdk 35
    defaultConfig {
        applicationId 'org.synthai.computer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin', 'src/main/jniLibs'] } }
    // PRoot is executed as a program, so libproot.so must exist as a real file in
    // nativeLibraryDir. Without legacy packaging, Android keeps native libs compressed
    // inside the APK and LinuxBridge finds no binary to run (silent shell fallback).
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes { release { minifyEnabled false } }
}
