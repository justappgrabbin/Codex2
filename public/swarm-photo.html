<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthia · Five dimensions make a photo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#07070c;color:#e8e6f0;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #2a2838;flex-wrap:wrap}
label,button{background:#15141f;color:#e8e6f0;border:1px solid #2a2838;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
input[type=file]{display:none}.k{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 8px}
main{flex:1;position:relative}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>
<header><label>Choose a photo<input id="pick" type="file" accept="image/*"></label>
 <span><span class="k" style="background:#ff6b6b"></span>Movement<span class="k" style="background:#ffd166"></span>Evolution<span class="k" style="background:#06d6a0"></span>Being<span class="k" style="background:#4cc9f0"></span>Design<span class="k" style="background:#b9a6ff"></span>Space</span>
 <button id="mix">Colors: five</button></header>
<main><canvas id="c"></canvas></main>
<script type="module">
// Five swarms, one per dimension, each with its own color and its own motion, never still.
// Every particle belongs to one pixel of the photo and moves around it in its dimension's way,
// so the five moving swarms together make the photo.
// Dimension motions follow the canon flows: Movement up, Being inward, Evolution outward,
// Design forward (around), Space toward where the others meet.
const DIMS = [
  { name: 'Movement', tint: [255, 107, 107] }, { name: 'Evolution', tint: [255, 209, 102] },
  { name: 'Being', tint: [6, 214, 160] }, { name: 'Design', tint: [76, 201, 240] }, { name: 'Space', tint: [185, 166, 255] }];
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let parts = [], tint = 1, img = null;

function sample(image, max = 9000) {
  const W = cv.clientWidth, H = cv.clientHeight, s = Math.min(W / image.width, H / image.height) * 0.92;
  const w = Math.round(image.width * s), h = Math.round(image.height * s), ox = (W - w) / 2, oy = (H - h) / 2;
  const off = new OffscreenCanvas(w, h), o = off.getContext('2d'); o.drawImage(image, 0, 0, w, h);
  const data = o.getImageData(0, 0, w, h).data, step = Math.max(2, Math.round(Math.sqrt((w * h) / max)));
  const out = [];
  for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
    const i = (y * w + x) * 4; if (data[i + 3] < 30) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    // which dimension a pixel belongs to: its position in the frame decides, so all five spread over the whole photo
    const d = ((x / step) + 2 * (y / step)) % 5 | 0;
    out.push({ hx: ox + x, hy: oy + y, x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, c: [r, g, b], d, ph: Math.random() * 6.28, size: step * 0.9 });
  }
  return out;
}
function frame(t) {
  const W = cv.clientWidth, H = cv.clientHeight; cx.fillStyle = 'rgba(7,7,12,0.35)'; cx.fillRect(0, 0, W, H);
  // where the others meet: the centroid of the swarm right now
  let mx = 0, my = 0; for (const p of parts) { mx += p.x; my += p.y; } mx /= parts.length || 1; my /= parts.length || 1;
  const s = t / 1000, amp = 5;
  for (const p of parts) {
    let ox = 0, oy = 0; const ph = p.ph + s;
    switch (p.d) {
      case 0: oy = -((s * 18 + p.ph * 9) % 14) + 7; break;                                        // Movement: rising, again and again
      case 1: { const dx = p.hx - W / 2, dy = p.hy - H / 2, n = Math.hypot(dx, dy) || 1, k = (Math.sin(ph * 1.6) + 1) * amp; ox = dx / n * k; oy = dy / n * k; break; } // Evolution: breathing outward
      case 2: { const dx = W / 2 - p.hx, dy = H / 2 - p.hy, n = Math.hypot(dx, dy) || 1, k = (Math.sin(ph * 1.2) + 1) * amp * 0.7; ox = dx / n * k; oy = dy / n * k; break; } // Being: drawing inward
      case 3: ox = Math.cos(ph * 2.2) * amp; oy = Math.sin(ph * 2.2) * amp; break;               // Design: circling forward
      case 4: ox = (mx - p.hx) * 0.012 * Math.sin(ph); oy = (my - p.hy) * 0.012 * Math.sin(ph); break; // Space: leaning to where the others meet
    }
    const tx = p.hx + ox, ty = p.hy + oy;
    p.vx = (p.vx + (tx - p.x) * 0.08) * 0.82; p.vy = (p.vy + (ty - p.y) * 0.08) * 0.82; p.x += p.vx; p.y += p.vy;
    // dimension color carried by the pixel's own light, so the photo survives the coloring
    const tc = DIMS[p.d].tint, m = tint, L = Math.min(1, (0.3 * p.c[0] + 0.59 * p.c[1] + 0.11 * p.c[2]) / 255 * 1.6 + 0.08);
    cx.fillStyle = `rgb(${p.c[0] * (1 - m) + tc[0] * L * m | 0},${p.c[1] * (1 - m) + tc[1] * L * m | 0},${p.c[2] * (1 - m) + tc[2] * L * m | 0})`;
    cx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  requestAnimationFrame(frame);
}
function load(src) { const im = new Image(); im.onload = () => { img = im; parts = sample(im); }; im.src = src; }
document.getElementById('pick').onchange = e => { const f = e.target.files[0]; if (f) load(URL.createObjectURL(f)); };
document.getElementById('mix').onclick = e => { tint = tint === 1 ? 0.45 : tint === 0.45 ? 0 : 1; e.target.textContent = 'Colors: ' + (tint === 0 ? 'photo' : tint === 1 ? 'five' : 'blend'); };
function size() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; cx.setTransform(d, 0, 0, d, 0, 0); if (img) parts = sample(img); }
window.__load = load; window.__tint = v => { tint = v; };
addEventListener('resize', size); size(); requestAnimationFrame(frame);
</script></body></html>
