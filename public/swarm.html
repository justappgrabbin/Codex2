<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthia · Swarm</title>
<script type="importmap">{"imports":{
  "node:url":"/node-shims/url.mjs","node:path":"/node-shims/path.mjs","node:fs":"/node-shims/fs.mjs",
  "node:fs/promises":"/node-shims/fs-promises.mjs","node:crypto":"/node-shims/crypto.mjs",
  "node:child_process":"/node-shims/child_process.mjs","node:util":"/node-shims/util.mjs","node:os":"/node-shims/os.mjs","node:buffer":"/node-shims/buffer.mjs"}}</script>
<script type="module" src="/node-shims/globals.mjs"></script>
<style>
:root{--bg:#0b0b12;--fg:#e8e6f0;--mut:#8a86a0;--line:#2a2838}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
button,label.btn,select{background:#15141f;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
input[type=file]{display:none}.mut{color:var(--mut)}
main{flex:1;position:relative;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);pointer-events:none;padding:24px;font-size:16px}
footer{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
footer input{flex:1;background:#15141f;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}
#say{position:absolute;left:10px;right:10px;bottom:10px;background:#15141fdd;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;display:none;max-height:30%;overflow:auto;white-space:pre-wrap}
</style></head><body>
<header>
 <label class="btn">Drop a file<input id="pick" type="file" multiple></label>
 <select id="which" style="display:none"></select>
 <span id="stat" class="mut">swarm idle</span>
</header>
<main>
 <canvas id="c"></canvas>
 <div id="hint">Drop a file, a folder of files or a .zip.<br>The swarm analyzes it and becomes it.</div>
 <div id="say"></div>
</main>
<footer>
 <input id="ask" placeholder="Describe something new — the swarm morphs into it">
 <button id="go">Morph</button>
 <button id="coder">Download Coder</button>
</footer>
<script type="module">
import { SwarmRuntime } from './computer-runtime/become/swarm-lowerer.mjs';
import { createModels } from './synthia-models.mjs';
import { unzipSync, strFromU8 } from './vendor/fflate.js';

const $ = id => document.getElementById(id), cv = $('c'), cx = cv.getContext('2d');
let rt = null, files = [], current = null, boxes = [], targets = [], parts = [], mode = 'idle', focus = null, sourceOf = new Map(), gen = 0;
const models = createModels(), coder = models.coder;

// ── ingest ───────────────────────────────────────────────────────────────
async function add(list) {
  const got = [];
  for (const f of list) { const p = f.webkitRelativePath || f.name;
    if (/\.zip$/i.test(p)) { const z = unzipSync(new Uint8Array(await f.arrayBuffer())); for (const [q, b] of Object.entries(z)) if (/\.(m?[jt]sx?)$/i.test(q) && !/node_modules\//.test(q)) got.push({ path: q, text: strFromU8(b) }); }
    else if (/\.(m?[jt]sx?)$/i.test(p)) got.push({ path: p, text: await f.text() }); }
  if (!got.length) { say('No JavaScript/TypeScript files in that drop.'); return; }
  files = got; for (const f of files) sourceOf.set(f.path, f.text);
  mode = 'dance'; $('hint').style.display = 'none'; seed(900); status('analyzing ' + files.length + ' file(s)…');
  await tick0();
  rt = new SwarmRuntime(); const proj = rt.formProject(files);
  const comps = []; for (const r of proj) for (const n of r.top || []) if (/^[A-Z]/.test(n)) comps.push({ file: r.file, name: n });
  const fns = proj.reduce((a, r) => a + (r.top?.length || 0), 0), latent = proj.reduce((a, r) => a + (r.skipped?.length || 0), 0);
  const w = $('which'); w.innerHTML = comps.map((c, i) => `<option value="${i}">${c.name} · ${c.file.split('/').pop()}</option>`).join(''); w.style.display = comps.length ? '' : 'none';
  w.onchange = () => become(comps[+w.value]);
  status(`${fns} formations in the swarm, ${latent} latent`);
  if (!comps.length) { say('Analyzed. No screens to become in these files — they are tools (functions) now living in the swarm.\nLatent: ' + proj.flatMap(r => r.skipped.map(s => s.name + ' — ' + s.reason)).slice(0, 12).join('\n')); mode = 'idle'; return; }
  const pick = comps.find(c => /^(App|Main|Home|Root)$/.test(c.name)) || comps[comps.length - 1];
  w.value = String(comps.indexOf(pick)); await become(pick);
}
const tick0 = () => new Promise(r => setTimeout(r, 30));

// ── become: run the component on the swarm, lay out its form, swarm into it ──
async function become(c) {
  current = c; const my = ++gen;
  try {
    const tree = await rt.render(await rt.run(c.file, c.name, [{}]));
    if (my !== gen) return;
    boxes = layout(tree); targetsFromBoxes(); mode = 'form';
    status(`became ${c.name} — running on the swarm (extended units, experimental)`);
  } catch (e) { say(`${c.name} could not become yet: ${e.message}`); mode = 'idle'; }
}

// Form tree -> boxes. Structure and inline styles are honored; Tailwind classes are not resolved.
function layout(tree) {
  const W = cv.clientWidth, out = [];
  const size = t => ({ h1: 30, h2: 24, h3: 19, button: 16 }[t] || 15);
  const BLOCK = /^(div|section|main|header|footer|nav|ul|ol|li|p|h1|h2|h3|h4|form|article|aside|fragment|label|table|tr)$/;
  const walk = (n, x, y, w, inherited) => {
    if (n == null || n === false) return { h: 0, w: 0 };
    if (typeof n !== 'object') { const text = String(n), fs = inherited.fs; cx.font = `${fs}px system-ui`; const tw = Math.min(w, cx.measureText(text).width + 2);
      out.push({ x, y, w: tw, h: fs * 1.35, text, fg: inherited.fg, fs }); return { h: fs * 1.35, w: tw }; }
    if (Array.isArray(n)) { let h = 0; for (const k of n) h += walk(k, x, y + h, w, inherited).h; return { h, w }; }
    const tag = String(n.type), st = n.props?.style || {}, pad = st.padding != null ? parseFloat(st.padding) : tag === 'button' ? 10 : /^(div|section|main|li|form|article)$/.test(tag) ? 6 : 0;
    const fg = st.color || (tag === 'button' ? '#ffffff' : inherited.fg), fs = st.fontSize ? parseFloat(st.fontSize) : size(tag) || inherited.fs;
    const bg = st.backgroundColor || st.background || (tag === 'button' ? '#6d5dfc' : tag === 'input' ? '#ffffff' : null);
    const box = { x, y, w, h: 0, bg, node: n, tag, radius: tag === 'button' ? 10 : 6 };
    out.push(box);
    if (tag === 'input' || tag === 'textarea') { box.w = Math.min(w, 260); box.h = 34; box.input = true;
      out.push({ x: x + 8, y: y + 8, w: box.w - 16, h: 18, text: String(n.props?.value ?? n.props?.placeholder ?? ''), fg: n.props?.value ? '#222' : '#999', fs: 14 }); return { h: 40, w: box.w }; }
    const row = st.display === 'flex' && st.flexDirection !== 'column' || tag === 'button' || tag === 'span' || tag === 'a';
    let cxp = x + pad, cy = y + pad, rowH = 0, maxW = 0;
    for (const k of n.children || []) {
      const childBlock = k && typeof k === 'object' && BLOCK.test(String(k.type));
      if (row && !childBlock) { const r = walk(k, cxp, cy, w - pad * 2 - (cxp - x), { fg, fs }); cxp += r.w + 4; rowH = Math.max(rowH, r.h); maxW = Math.max(maxW, cxp - x); }
      else { if (rowH) { cy += rowH + 4; rowH = 0; cxp = x + pad; } const r = walk(k, x + pad, cy, w - pad * 2, { fg, fs }); cy += r.h + (childBlock ? 6 : 0); maxW = Math.max(maxW, r.w + pad * 2); }
    }
    if (rowH) cy += rowH;
    box.h = Math.max(cy - y + pad, tag === 'button' ? fs + pad * 2 : 0);
    if (row || tag === 'button') box.w = Math.min(w, Math.max(maxW + pad, 40));
    if (n.props?.onClick) box.click = n.props.onClick;
    if (n.props?.onChange) box.change = n.props.onChange;
    return { h: box.h + (BLOCK.test(tag) ? 4 : 0), w: box.w };
  };
  const pad = 20; walk(tree, pad, pad, Math.min(W - pad * 2, 720), { fg: '#e8e6f0', fs: 15 }); return out;
}

// ── the swarm: particles take every box and every letter as their target ──
function targetsFromBoxes() {
  targets = [];
  const fills = boxes.filter(b => b.bg && !b.text), area = fills.reduce((a, b) => a + b.w * b.h, 0) || 1;
  for (const b of fills) { const n = Math.max(30, Math.round(2400 * b.w * b.h / area)); for (let i = 0; i < n; i++) targets.push({ x: b.x + Math.random() * b.w, y: b.y + Math.random() * b.h, c: b.bg, s: 3 }); }
  for (const b of boxes.filter(b => b.text)) { cx.font = `${b.fs}px system-ui`; let x = b.x;
    for (const ch of b.text) { const cw = cx.measureText(ch).width; if (ch !== ' ') targets.push({ x, y: b.y + b.fs, c: b.fg, ch, fs: b.fs }); x += cw; } }
  while (parts.length < targets.length) parts.push(spawn());
  parts.length = Math.max(targets.length, 1);
}
const spawn = () => ({ x: Math.random() * cv.clientWidth, y: Math.random() * cv.clientHeight, vx: 0, vy: 0, c: '#b9a6ff' });
function seed(n) { while (parts.length < n) parts.push(spawn()); }

function frame(t) {
  const W = cv.clientWidth, H = cv.clientHeight; cx.clearRect(0, 0, W, H);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i], tg = targets[i];
    let tx, ty;
    if (mode === 'dance' || !tg) { const a = t / 900 + i * 0.37, r = 80 + (i % 9) * 22 + 30 * Math.sin(t / 700 + i); tx = W / 2 + Math.cos(a) * r; ty = H / 2 + Math.sin(a * 1.3) * r * 0.7; }
    else { tx = tg.x; ty = tg.y; }
    p.vx = (p.vx + (tx - p.x) * (mode === 'dance' ? 0.02 : 0.09)) * 0.8; p.vy = (p.vy + (ty - p.y) * (mode === 'dance' ? 0.02 : 0.09)) * 0.8;
    p.x += p.vx; p.y += p.vy;
    const col = mode === 'dance' ? `hsl(${(i * 7 + t / 20) % 360} 80% 70%)` : tg?.c || '#555';
    if (tg?.ch && mode !== 'dance') { cx.fillStyle = col; cx.font = `${tg.fs}px system-ui`; cx.fillText(tg.ch, p.x, p.y); }
    else { cx.fillStyle = col; cx.fillRect(p.x - 1.5, p.y - 1.5, tg?.s || 3, tg?.s || 3); }
  }
  if (focus) { cx.strokeStyle = '#b9a6ff'; cx.strokeRect(focus.x, focus.y, focus.w, focus.h); }
  requestAnimationFrame(frame);
}

// ── interaction runs on the swarm ─────────────────────────────────────────
const invoke = (f, ...a) => rt.kernel.vm.operators.get('invoke')([f, ...a]);
cv.addEventListener('pointerdown', async e => {
  if (mode !== 'form') return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = boxes.filter(b => (b.click || b.input) && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h).pop();
  focus = hit?.input ? hit : null;
  if (hit?.click) { await invoke(hit.click, { type: 'click' }); await become(current); }
});
addEventListener('keydown', async e => {
  if (!focus || document.activeElement === $('ask')) return; e.preventDefault();
  const cur = String(focus.node.props?.value ?? ''), next = e.key === 'Backspace' ? cur.slice(0, -1) : e.key.length === 1 ? cur + e.key : cur;
  if (focus.change) { await invoke(focus.change, { target: { value: next } }); const f = focus; await become(current); focus = boxes.find(b => b.input && b.node.props?.placeholder === f.node.props?.placeholder) || null; }
});

// ── describe something new: Qwen writes it, the swarm dances, then snaps into it ──
async function morphTo(code, label = 'Synthia') {
  const file = `synthia-${Date.now()}.jsx`;
  const r = rt.formFile(code, file);
  const name = r.top.filter(n => /^[A-Z]/.test(n)).pop();
  if (!name) { mode = 'form'; say(`${label}: nothing to become yet — ` + (r.skipped.map(s => s.name + ': ' + s.reason).join('; ') || 'no component found')); return false; }
  sourceOf.set(file, code); await become({ file, name }); say(`${label}: became ${name}.`); return true;
}
window.__morphTo = morphTo;
$('go').onclick = async () => {
  const want = $('ask').value.trim(); if (!want) return;
  if (coder.state !== 'ready') { say('Download the Coder first (button on the right) — it runs on this device.'); return; }
  mode = 'dance'; status('Synthia is building it…'); say('');
  const base = current ? sourceOf.get(current.file) || '' : '';
  const sys = 'You write ONE React function component in plain JSX. No imports, no TypeScript, no classes, no hooks except useState. Use inline style objects only (backgroundColor, color, padding, fontSize, display, flexDirection). Reply with only the code in one ```jsx block.';
  const user = (base ? `Current component:\n\`\`\`jsx\n${base.slice(0, 3000)}\n\`\`\`\n` : '') + `Make this: ${want}`;
  let text = '';
  try { text = await coder.chat([{ role: 'system', content: sys }, { role: 'user', content: user }], { maxNewTokens: 600, onToken: t => { text += t; $('say').style.display = 'block'; $('say').textContent = text.slice(-600); } }); }
  catch (e) { mode = 'form'; say('Coder error: ' + e.message); return; }
  const code = (text.match(/```(?:jsx|js|tsx)?\n([\s\S]*?)```/) || [, text])[1];
  await morphTo(code, 'Synthia');
};
$('coder').onclick = () => { coder.load(); };
coder.on(s => { $('coder').textContent = s.state === 'ready' ? 'Coder ready' : s.state === 'loading' ? `Coder ${Math.round((s.progress || 0) * 100)}%` : s.state === 'error' ? 'Coder failed — retry' : 'Download Coder'; });

function status(t) { $('stat').textContent = t; }
function say(t) { const s = $('say'); s.style.display = t ? 'block' : 'none'; s.textContent = t; }
$('pick').onchange = e => add([...e.target.files]);
const m = document.querySelector('main'); m.addEventListener('dragover', e => e.preventDefault()); m.addEventListener('drop', e => { e.preventDefault(); add([...e.dataTransfer.files]); });
function size() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; cx.setTransform(d, 0, 0, d, 0, 0); if (mode === 'form') targetsFromBoxes(); }
addEventListener('resize', size); size(); seed(400); requestAnimationFrame(frame);
</script></body></html>
