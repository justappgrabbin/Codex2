<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthia · Swarm forms the page</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0b12;color:#e8e6f0;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid #2a2838}
label{background:#15141f;border:1px solid #2a2838;border-radius:6px;padding:6px 10px;cursor:pointer}input{display:none}
#stat{color:#8a86a0}main{flex:1;position:relative}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head><body>
<header><label>Drop a markdown file<input id="pick" type="file" accept=".md,.txt,.markdown"></label><span id="stat">waiting for a file</span></header>
<main><canvas id="c"></canvas></main>
<script type="module">
// Every character on the page is a swarm unit. Its being is the character's own bits (UTF-16 code unit,
// 16 bits) plus 4 style bits (heading, bold, code, list). The units start scattered and fly into the places
// the document's layout gives them, forming the page. Nothing is drawn except the units.
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let units = [], t0 = 0;
const STYLE = { h1: 0b1000, h2: 0b1000, h3: 0b1000, bold: 0b0100, code: 0b0010, li: 0b0001, p: 0 };

function parse(md) {                                     // markdown -> blocks of styled runs
  const blocks = []; let code = false;
  for (const raw of md.replace(/\r/g, '').split('\n')) {
    if (/^```/.test(raw)) { code = !code; continue; }
    if (code) { blocks.push({ kind: 'code', runs: [{ text: raw || ' ', style: 'code' }] }); continue; }
    if (!raw.trim()) { blocks.push({ kind: 'gap' }); continue; }
    const h = raw.match(/^(#{1,3})\s+(.*)/); if (h) { blocks.push({ kind: 'h' + h[1].length, runs: runs(h[2], 'h' + h[1].length) }); continue; }
    const li = raw.match(/^\s*[-*]\s+(.*)/); if (li) { blocks.push({ kind: 'li', runs: [{ text: '•  ', style: 'li' }, ...runs(li[1], 'li')] }); continue; }
    blocks.push({ kind: 'p', runs: runs(raw, 'p') });
  }
  return blocks;
}
function runs(text, base) { const out = []; text.split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(part => {
  if (!part) return; if (/^\*\*/.test(part)) out.push({ text: part.slice(2, -2), style: 'bold' });
  else if (/^`/.test(part)) out.push({ text: part.slice(1, -1), style: 'code' }); else out.push({ text: part, style: base }); }); return out; }

const FONT = { h1: 'bold 28px system-ui', h2: 'bold 22px system-ui', h3: 'bold 18px system-ui', bold: 'bold 15px system-ui', code: '14px ui-monospace,monospace', li: '15px system-ui', p: '15px system-ui' };
const COLOR = { h1: '#ffd166', h2: '#b9a6ff', h3: '#4cc9f0', bold: '#ffffff', code: '#06d6a0', li: '#e8e6f0', p: '#d8d6e4' };
const LINE = { h1: 40, h2: 32, h3: 26, code: 20, li: 22, p: 22 };

function layout(blocks) {                                // the page's layout gives every unit its place
  const W = cv.clientWidth, maxW = Math.min(W - 40, 760), left = (W - maxW) / 2, out = []; let y = 36;
  for (const b of blocks) {
    if (b.kind === 'gap') { y += 10; continue; }
    let x = left + (b.kind === 'li' ? 12 : 0); const lh = LINE[b.kind] || 22;
    if (b.kind === 'code') { out.push({ box: true, x: left - 6, y: y - 15, w: maxW + 12, h: lh }); }
    for (const r of b.runs) { cx.font = FONT[r.style];
      for (const word of r.text.split(/(\s+)/)) { const ww = cx.measureText(word).width;
        if (x + ww > left + maxW && word.trim()) { x = left + (b.kind === 'li' ? 26 : 0); y += lh; }
        for (const ch of word) { const cw = cx.measureText(ch).width; if (ch.trim())
          out.push({ ch, x, y, style: r.style, bits: ((ch.charCodeAt(0) & 0xffff) << 4) | STYLE[r.style] }); x += cw; } } }
    y += lh + (/^h/.test(b.kind) ? 8 : 2);
  }
  return out;
}

function become(md) {
  const placed = layout(parse(md)), W = cv.clientWidth, H = cv.clientHeight;
  units = placed.map((p, i) => ({ ...p, sx: Math.random() * W, sy: Math.random() * H, px: 0, py: 0, delay: (i % 120) * 6 + Math.random() * 300 }));
  for (const u of units) { u.px = u.sx; u.py = u.sy; }
  t0 = performance.now();
  document.getElementById('stat').textContent = `${units.filter(u => !u.box).length} units forming the page`;
}
function frame(t) {
  const W = cv.clientWidth, H = cv.clientHeight; cx.clearRect(0, 0, W, H);
  for (const u of units) {
    const k = Math.min(1, Math.max(0, (t - t0 - u.delay) / 1400)), e = 1 - Math.pow(1 - k, 3);
    const wob = (1 - e) * 30;
    u.px = u.sx + (u.x - u.sx) * e + Math.sin(t / 300 + u.x) * wob; u.py = u.sy + (u.y - u.sy) * e + Math.cos(t / 260 + u.y) * wob;
    if (u.box) { cx.fillStyle = `rgba(6,214,160,${0.08 * e})`; cx.fillRect(u.x, u.y, u.w, u.h); continue; }
    cx.globalAlpha = 0.35 + 0.65 * e; cx.font = FONT[u.style]; cx.fillStyle = COLOR[u.style]; cx.fillText(u.ch, u.px, u.py);
  }
  cx.globalAlpha = 1; requestAnimationFrame(frame);
}
function size() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; cx.setTransform(d, 0, 0, d, 0, 0); }
document.getElementById('pick').onchange = async e => { const f = e.target.files[0]; if (f) become(await f.text()); };
document.querySelector('main').addEventListener('dragover', e => e.preventDefault());
document.querySelector('main').addEventListener('drop', async e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) become(await f.text()); });
window.__become = become;
addEventListener('resize', size); size(); requestAnimationFrame(frame);
</script></body></html>
