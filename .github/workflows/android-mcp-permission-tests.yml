name: Android MCP permission boundary tests
on:
  push:
    branches:
      - feature/android-permission-gate-20261122
  workflow_dispatch:
jobs:
  permission-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test explicit Android MCP permissions
        run: node --test computer/tests/android-permission-gate.test.mjs
